# Path: .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual run button
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#e9d5ff,#c084fc,#a855f7,#7e22ce&color_dot_border=#ffffff00&size_dot=11&size_cell=15&size_dot_border_radius=4
            dist/snake-dark.svg?color_snake=#38BDF8&color_dots=#161b22,#4a0f5c,#8a1fa6,#c72fe0,#E22FE4&color_dot_border=#ffffff00&size_dot=11&size_cell=15&size_dot_border_radius=4
            dist/snake.gif?color_snake=#38BDF8&color_dots=#0F172A,#4a0f5c,#8a1fa6,#c72fe0,#E22FE4&size_dot=11&size_cell=15&size_dot_border_radius=4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
